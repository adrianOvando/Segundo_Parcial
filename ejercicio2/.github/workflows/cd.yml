name: CD - Despliegue Continuo a Amazon EC2

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: 1. Pruebas Automatizadas
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar dependencias limpias
        run: npm ci

      - name: Ejecutar pruebas unitarias y de integracion
        run: npm test

  build-and-push:
    name: 2. Construir y Publicar Imagen Docker en GHCR
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Iniciar sesion en GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determinar nombre de imagen en minusculas
        run: |
          IMAGE_NAME="ghcr.io/${GITHUB_REPOSITORY,,}/libros-api"
          echo "IMAGE_NAME=$IMAGE_NAME" >> $GITHUB_ENV

      - name: Construir y publicar imagen Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest

  deploy:
    name: 3. Desplegar en EC2 con Verificacion y Rollback
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Determinar nombre de imagen en minusculas
        run: |
          IMAGE_NAME="ghcr.io/${GITHUB_REPOSITORY,,}/libros-api"
          echo "IMAGE_NAME=$IMAGE_NAME" >> $GITHUB_ENV

      - name: Ejecutar despliegue seguro en EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST || secrets.SSH_HOST }}
          username: ${{ secrets.EC2_USER || secrets.SSH_USER }}
          key: ${{ secrets.EC2_SSH_KEY || secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            IMAGE="${{ env.IMAGE_NAME }}:${{ github.sha }}"

            echo "=========================================================="
            echo "Iniciando sesion en GitHub Container Registry..."
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

            echo "Guardando referencia a version previa para rollback..."
            OLD_IMAGE=$(docker inspect --format='{{.Config.Image}}' libros-api 2>/dev/null || echo "")

            echo "Descargando nueva imagen: $IMAGE"
            docker pull "$IMAGE"

            echo "Deteniendo contenedor actual..."
            docker rm -f libros-api 2>/dev/null || true

            echo "Iniciando nuevo contenedor en 127.0.0.1:3000..."
            docker run -d --name libros-api --restart unless-stopped \
              -p 127.0.0.1:3000:3000 \
              --env-file /home/ubuntu/.env \
              "$IMAGE"

            echo "Esperando 5 segundos a que estabilice..."
            sleep 5

            echo "Ejecutando verificacion de salud y consulta de datos..."
            if ! curl -fsS http://127.0.0.1:3000/health || ! curl -fsS http://127.0.0.1:3000/libros; then
              echo "!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!"
              echo "Falló la verificación, restaurando versión anterior..."
              echo "!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!"
              docker rm -f libros-api 2>/dev/null || true
              if [ -n "$OLD_IMAGE" ]; then
                echo "Restaurando imagen previa: $OLD_IMAGE"
                docker run -d --name libros-api --restart unless-stopped \
                  -p 127.0.0.1:3000:3000 \
                  --env-file /home/ubuntu/.env \
                  "$OLD_IMAGE"
              fi
              exit 1
            fi

            echo ""
            echo ">>> Despliegue completado con exito. Version ${{ github.sha }} activa <<<"
            docker system prune -f 2>/dev/null || true
