# ==========================================================
# Configuración de Nginx como Proxy Inverso para la API Libros
# Ubicación en EC2: /etc/nginx/sites-available/default
# o /etc/nginx/conf.d/libros.conf
# ==========================================================

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Logs de acceso y error
    access_log /var/log/nginx/libros_api_access.log;
    error_log /var/log/nginx/libros_api_error.log;

    # Proxy inverso hacia el servicio Node.js / Docker
    # El servicio escucha localmente en 127.0.0.1:3000
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
